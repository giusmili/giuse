<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tâches — 29/06/2026</title>

  <!-- Google Fonts : Slabo 27px -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Slabo+27px&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-start justify-center px-4 py-12">

  <main class="w-full max-w-2xl">

    <!-- Header -->
    <header class="mb-8 text-center">
      <p class="text-slate-400 text-sm tracking-widest uppercase mb-1" id="date-display"></p>
      <h1 class="text-4xl font-bold text-white">Mes tâches du jour</h1>
    </header>

    <!-- Progress bar -->
    <div class="mb-8">
      <div class="flex justify-between text-sm text-slate-400 mb-2">
        <span id="progress-label">0 / 0 complétées</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- Input zone -->
    <div class="flex gap-3 mb-6">
      <input
        id="task-input"
        type="text"
        placeholder="Ajouter une tâche…"
        maxlength="120"
        class="flex-1 bg-slate-700/60 border border-slate-600 text-white placeholder-slate-400 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30 transition"
      />
      <button
        id="add-btn"
        class="bg-violet-600 hover:bg-violet-500 active:scale-95 text-white font-semibold px-5 py-3 rounded-xl text-sm transition-all duration-150 flex items-center gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Ajouter
      </button>
    </div>

    <!-- Filters -->
    <div class="flex gap-2 mb-6" id="filters">
      <button data-filter="all"     class="filter-btn active-filter">Toutes</button>
      <button data-filter="pending" class="filter-btn">À faire</button>
      <button data-filter="done"    class="filter-btn">Terminées</button>
    </div>

    <!-- Task list -->
    <ul id="task-list" class="space-y-3"></ul>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16 text-slate-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto mb-4 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p class="text-sm">Aucune tâche ici.</p>
    </div>

    <!-- Footer actions -->
    <div class="mt-8 flex justify-end">
      <button id="clear-done-btn" class="text-xs text-slate-500 hover:text-rose-400 transition-colors">
        Supprimer les terminées
      </button>
    </div>

  </main>

  <!-- App logic -->
  <script src="js/app.js"></script>
</body>
</html>
